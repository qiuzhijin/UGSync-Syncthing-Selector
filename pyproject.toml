[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ugsync-client"
version = "0.1.0"
description = "Selective Windows and UGOS NAS synchronization"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "keyring==25.7.0; sys_platform == 'win32'", "watchdog==6.0.0; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "PyYAML>=6,<7"]
ui = ["PySide6==6.10.1"]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.9", "altgraph==0.17.5", "pefile==2024.8.26", "pywin32-ctypes==0.2.3", "setuptools==84.2.0"]

[tool.setuptools.packages.find]
where = ["client"]

[tool.pytest.ini_options]
pythonpath = ["client", "."]
testpaths = ["tests"]
